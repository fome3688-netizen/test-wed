
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？抽籤器</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff7ec;
      color: #33281f;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 36px rgba(91,55,22,.11);
    }

    h1 { text-align: center; }

    .hint {
      text-align: center;
      color: #75675d;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 14px;
      border: 2px solid #e7d8c9;
      border-radius: 12px;
      font: inherit;
      line-height: 1.7;
      resize: vertical;
    }

    textarea:focus {
      border-color: #e48f3d;
    }

    button {
      width: 100%;
      margin: 18px 0;
      padding: 14px;
      background: #ed8731;
      color: white;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #d9731c; }

    .result {
      background: #fff3df;
      border-radius: 12px;
      text-align: center;
      padding: 22px 12px;
    }

    .result-title {
      color: #785d43;
      font-size: 14px;
    }

    #result {
      font-weight: bold;
      font-size: 27px;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b12f26;
      font-size: 19px !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>🍱 今天吃什麼？</h1>
    <p class="hint">選擇困難？交給隨機抽籤吧！</p>

    <label for="options">想吃的選項（每行一個）</label>
    <textarea id="options">便當
麵
咖哩
水餃</textarea>

    <button id="pickButton" type="button">
      幫我選 🎲
    </button>

    <section class="result" aria-live="polite">
      <p class="result-title">抽籤結果</p>
      <p id="result">按下按鈕開始抽籤！</p>
    </section>
  </main>

  <script>
    const input = document.getElementById("options");
    const result = document.getElementById("result");
    const button = document.getElementById("pickButton");

    button.addEventListener("click", () => {
      const options = [...new Set(
        input.value
          .split(/\r?\n/)
          .map(item => item.trim())
          .filter(Boolean)
      )];

      if (options.length === 0) {
        result.textContent = "請先輸入至少一個選項";
        result.classList.add("error");
        return;
      }

      const index = Math.floor(Math.random() * options.length);
      result.textContent = "今天就吃：" + options[index] + "！";
      result.classList.remove("error");
    });
  </script>
</body>
</html>
